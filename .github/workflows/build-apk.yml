name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Create www directory and copy web assets
        run: |
          mkdir -p www
          cp index.html www/
          curl -fsSL "https://raw.githubusercontent.com/ahmetbayrak19-afk/borc-takip/c477ca8ab783c9b3c5bb91b1fb05d68305407b18/app.js" -o www/app.js
          test -s www/app.js
          grep -q "function hideSplash" www/app.js
          if [ -f logo.png ]; then cp logo.png www/logo.png; fi
          if [ -f resources/icon.png ]; then cp resources/icon.png www/icon.png; fi
          ls -la www/
          wc -c www/app.js www/index.html

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -q WRITE_EXTERNAL_STORAGE "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
            grep -q READ_EXTERNAL_STORAGE "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
            grep -q POST_NOTIFICATIONS "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            grep -q VIBRATE "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST"
            grep -E "uses-permission" "$MANIFEST" || true
          fi

      - name: Generate launcher icons
        run: |
          if [ -f scripts/make_icons.py ] && [ -f resources/icon.png ]; then
            python3 -m pip install --quiet pillow
            python3 scripts/make_icons.py
          else
            echo "Icon script or resources/icon.png missing, skipping"
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK bulunamadi"
            find android -name "*.apk" -type f || true
            exit 1
          fi
          cp "$APK_PATH" ./borc-takip.apk
          ls -lh borc-takip.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: borc-takip-apk
          path: borc-takip.apk
          retention-days: 30
