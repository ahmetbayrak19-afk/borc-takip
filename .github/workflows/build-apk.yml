name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Create www directory and copy web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          if [ -f resources/icon.png ]; then
            cp resources/icon.png www/logo.png
            cp resources/icon.png www/icon.png
          fi
          if [ -f logo.png ]; then
            cp logo.png www/logo.png
          fi
          ls -la www/

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Add Android permissions (storage + notifications)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
            fi
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST"
            fi
            echo "=== Permissions ==="
            grep -E "uses-permission" "$MANIFEST" || true
          fi

      - name: Generate Android launcher icons from resources/icon.png
        run: |
          python3 -m pip install --quiet pillow
          python3 << 'PY'
          from PIL import Image
          from pathlib import Path
          import os

          src = Path("resources/icon.png")
          if not src.exists():
              raise SystemExit("resources/icon.png bulunamadı")

          img = Image.open(src).convert("RGBA")
          w, h = img.size
          side = max(w, h)
          canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          canvas.paste(img, ((side - w) // 2, (side - h) // 2), img)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          fg_sizes = {
              "mipmap-mdpi": 108,
              "mipmap-hdpi": 162,
              "mipmap-xhdpi": 216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi": 432,
          }

          res = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              out_dir = res / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              icon = canvas.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  icon.save(out_dir / name, "PNG")
                  print("wrote", out_dir / name)

          for folder, size in fg_sizes.items():
              out_dir = res / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              pad = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              inner = int(size * 0.66)
              small = canvas.resize((inner, inner), Image.Resampling.LANCZOS)
              offset = (size - inner) // 2
              pad.paste(small, (offset, offset), small)
              pad.save(out_dir / "ic_launcher_foreground.png", "PNG")
              print("wrote", out_dir / "ic_launcher_foreground.png")

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          for xml_name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (anydpi / xml_name).write_text(
                  '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''.strip() + "\n", encoding="utf-8")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0B1B3A</color>
          </resources>
          '''.strip() + "\n", encoding="utf-8")
          print("Icon generation OK")
          PY

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK bulunamadı!"
            find android -name "*.apk" -type f || true
            exit 1
          fi
          cp "$APK_PATH" ./borc-takip.apk
          ls -lh borc-takip.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: borc-takip-apk
          path: borc-takip.apk
          retention-days: 30
