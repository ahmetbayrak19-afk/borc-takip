name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # Manuel çalıştırma için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java (for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Create www directory and copy web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          echo "Web assets hazırlandı"

      - name: Install npm dependencies
        run: npm install

      - name: Initialize Capacitor & add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find and prepare APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK bulundu: $APK_PATH"
          cp "$APK_PATH" ./borc-takip.apk
          echo "apk_path=borc-takip.apk" >> $GITHUB_OUTPUT
          ls -lh borc-takip.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: borc-takip-apk
          path: borc-takip.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### ✅ APK başarıyla oluşturuldu!" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts sekmesinden **borc-takip-apk** indirip telefonuna yükleyebilirsin." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Not: Debug APK olduğu için imza uyarısı çıkabilir, 'Yine de yükle' diyerek kurabilirsin." >> $GITHUB_STEP_SUMMARY
