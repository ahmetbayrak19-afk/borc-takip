name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Create www directory and copy web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          ls -la www/

      - name: Install npm dependencies
        run: |
          npm install --prefer-offline --no-audit --no-fund

      - name: Add Android platform with Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find android -name "*.apk" -type f
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK bulunamadı!"
            exit 1
          fi
          cp "$APK_PATH" ./borc-takip.apk
          ls -lh borc-takip.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: borc-takip-apk
          path: borc-takip.apk
          retention-days: 30
