name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create www directory and copy web assets
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          mkdir -p www
          cp index.html i18n.js app.js app.css www/
          cp privacy.html terms.html www/
          mkdir -p www/vendor/fontawesome
          cp -R node_modules/@fortawesome/fontawesome-free/css www/vendor/fontawesome/
          cp -R node_modules/@fortawesome/fontawesome-free/webfonts www/vendor/fontawesome/
          if [ -f logo.png ]; then cp logo.png www/logo.png; fi
          if [ -f resources/icon.png ]; then cp resources/icon.png www/icon.png; fi
          ls -la www/
          wc -c www/app.js www/index.html

      - name: Add Android platform with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 36/' android/variables.gradle
          sed -i -E 's/targetSdkVersion = [0-9]+/targetSdkVersion = 36/' android/variables.gradle
          sed -i -E "s/com.android.tools.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.9.1/" android/build.gradle
          sed -i -E 's#gradle-[0-9.]+-all.zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep -E 'compileSdkVersion|targetSdkVersion' android/variables.gradle
          grep 'com.android.tools.build:gradle' android/build.gradle

      - name: Disable Android automatic backup and device transfer
        run: python3 scripts/configure_android_backup.py

      - name: Add Google Drive authentication plugin
        run: |
          JAVA_DIR="android/app/src/main/java/com/borctakip/app"
          mkdir -p "$JAVA_DIR"
          cp android-plugins/GoogleDriveAuthPlugin.java "$JAVA_DIR/GoogleDriveAuthPlugin.java"
          cp android-plugins/MainActivity.java "$JAVA_DIR/MainActivity.java"
          GRADLE_FILE="android/app/build.gradle"
          grep -q "play-services-auth" "$GRADLE_FILE" || sed -i "/dependencies {/a\\    implementation 'com.google.android.gms:play-services-auth:21.2.0'" "$GRADLE_FILE"

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -q WRITE_EXTERNAL_STORAGE "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$MANIFEST"
            grep -q READ_EXTERNAL_STORAGE "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
            grep -q POST_NOTIFICATIONS "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            grep -q VIBRATE "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST"
            grep -E "uses-permission" "$MANIFEST" || true
          fi

      - name: Set increasing Android version
        run: |
          GRADLE_FILE="android/app/build.gradle"
          sed -i "s/versionCode [0-9][0-9]*/versionCode $GITHUB_RUN_NUMBER/" "$GRADLE_FILE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.2.$GITHUB_RUN_NUMBER\"/" "$GRADLE_FILE"

      - name: Generate launcher icons
        run: |
          if [ -f scripts/make_icons.py ] && [ -f resources/icon.png ]; then
            python3 -m pip install --quiet pillow
            python3 scripts/make_icons.py
          else
            echo "Icon script or resources/icon.png missing, skipping"
          fi

      - name: Build APK and Play App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Verify empty-install and Android backup policy in APK
        run: |
          APK_TO_CHECK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_TO_CHECK"
          python3 scripts/configure_android_backup.py --verify-apk "$APK_TO_CHECK"

      - name: Sign APK with fixed key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Play paketi için sabit imza bilgileri zorunludur."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/borc-takip.jks"
          APK_INPUT=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/borc-takip.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --out android/app/build/outputs/apk/borc-takip-fixed.apk \
            "$APK_INPUT"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/borc-takip-fixed.apk
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/borc-takip-fixed.apk
          AAB_INPUT=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          test -n "$AAB_INPUT"
          jarsigner \
            -keystore "$RUNNER_TEMP/borc-takip.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEYSTORE_PASSWORD" \
            -signedjar android/app/build/outputs/bundle/borc-takip-play.aab \
            "$AAB_INPUT" "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/borc-takip-play.aab

      - name: Locate APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "borc-takip-fixed.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "APK bulunamadi"
            find android -name "*.apk" -type f || true
            exit 1
          fi
          cp "$APK_PATH" ./borc-takip.apk
          AAB_PATH="android/app/build/outputs/bundle/borc-takip-play.aab"
          test -f "$AAB_PATH"
          cp "$AAB_PATH" ./borc-takip-play.aab
          ls -lh borc-takip.apk borc-takip-play.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: borc-takip-yayin-paketi
          path: |
            borc-takip.apk
            borc-takip-play.aab
          retention-days: 30
